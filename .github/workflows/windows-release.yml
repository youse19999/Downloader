name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Assemble distribution ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/downloader.exe dist/
          Copy-Item README.md dist/README.txt
          Compress-Archive -Path dist/* -DestinationPath downloader-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: downloader-windows-x64
          path: downloader-windows-x64.zip
          retention-days: 14
